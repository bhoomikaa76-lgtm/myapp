<!DOCTYPE html>
<html>

<head>
    <title>Product List</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        h2{
            text-align:center;
        }

        table{
            width:60%;
            margin:auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        th{
            background:#4CAF50;
            color:white;
        }

    </style>

</head>

<body>

<h2>Product Details</h2>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Price</th>
</tr>

{% for p in products1 %}

<tr>
    <td>{{ p.id }}</td>
    <td>{{ p.name }}</td>
    <td>{{ p.price }}</td>
</tr>

{% endfor %}

</table>

</body>

</html>
