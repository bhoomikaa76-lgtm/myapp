<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white; 
            margin: 10px;
        }

        h1 {
            background-color: darkgreen;
            color: white;
            padding: 10px;
        }

        table {
            width: 50%;
            border-collapse: collapse;
            border: 1px solid black;
           
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: skyblue;
        }

        tr:hover {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1><bold>Products</bold></h1>

    <table id="data">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>01</td>
            <td>Wireless Mouse</td>
            <td>15</td>
        </tr>

        <tr>
            <td>02</td>
            <td>Laptop Stand</td>
            <td>29.99</td>
        </tr>

        <tr>
            <td>03</td>
            <td>Laptop Bag</td>
            <td>250</td>
        </tr>

  </table>

</body>
</html>
